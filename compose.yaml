services:
  reviewlab:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REVIEWLAB_PORT:-3000}:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-}
      PILOT_INVITE_CODE: ${PILOT_INVITE_CODE:-}
      WHATSAPP_GROUP_URL: ${WHATSAPP_GROUP_URL:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-gemini-3.1-flash-lite}
      TRIAGE_MONTHLY_CALL_LIMIT: ${TRIAGE_MONTHLY_CALL_LIMIT:-100}
      TRIAGE_TRANSCRIBE_AUDIO: ${TRIAGE_TRANSCRIBE_AUDIO:-0}
    volumes:
      - reviewlab-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  reviewlab-data:
